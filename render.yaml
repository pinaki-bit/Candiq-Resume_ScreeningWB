services:
  # ----------------------------------------------------
  # 1. Backend Web Service (FastAPI)
  # ----------------------------------------------------
  - type: web
    name: candiq-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port 10000"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./resume_screening.db
      - key: ALLOWED_ORIGINS
        value: "*"
      # The Secret Key will be automatically generated, but you can set one manually here:
      # - key: SECRET_KEY
      #   value: your_super_secret_key_here

  # ----------------------------------------------------
  # 2. Frontend Static Site (React/Vite)
  # ----------------------------------------------------
  - type: web
    name: candiq-frontend
    env: static
    rootDir: frontend_react
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      # Automatically points the frontend to the backend URL on Render
      - key: VITE_API_URL
        fromService:
          type: web
          name: candiq-backend
          envVarKey: RENDER_EXTERNAL_URL
        # Append /api/v1 to the backend URL
      - key: VITE_API_URL_SUFFIX
        value: /api/v1
